<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBEDE8">
<meta name="color-scheme" content="light only">
<title>心情投票</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* 學員頁：一個問題、幾個大按鈕，點一下就完成 */
:root{
  --sky:#F4F0FA; --dawn:#FBEDE8; --paper:#FFFDFB;
  --ink:#3A3347; --muted:#5E556C; --line:#E8E1F0;
  --accent:#7C68AE; --accent-deep:#5B4A8A;
  --sage:#E7F0EA; --sage-ink:#3F5E4C;
  --shadow:0 6px 24px rgba(91,74,138,.08),0 1px 3px rgba(91,74,138,.06);
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--sky)}
body{color:var(--ink);font-family:var(--sans);font-size:21px;line-height:1.7;min-height:100vh;
  background:linear-gradient(180deg,var(--dawn) 0,var(--sky) 380px) no-repeat,var(--sky)}
main{max-width:32rem;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:22px}
.kicker{margin:0;color:var(--accent-deep);font-size:.8em;letter-spacing:.12em}
h1{margin:0;font-family:var(--serif);font-size:1.45em;line-height:1.5;color:var(--accent-deep);text-wrap:balance}
.how{margin:0;color:var(--muted);font-size:.85em}
.opts{display:flex;flex-direction:column;gap:14px}
.opt{display:flex;align-items:center;gap:16px;width:100%;min-height:92px;padding:12px 20px;border-radius:24px;text-align:left;cursor:pointer;
  font:inherit;color:var(--ink);-webkit-tap-highlight-color:transparent;
  background:linear-gradient(180deg,#fff,rgba(246,242,252,.9));border:2px solid #fff;
  box-shadow:0 8px 20px rgba(91,74,138,.12),inset 0 -3px 6px rgba(124,104,174,.08),0 0 0 1px rgba(124,104,174,.12);
  transition:transform .15s,box-shadow .2s,border-color .2s}
.opt:active{transform:translateY(2px)}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.opt .emo{flex:none;font-size:2.1em;line-height:1;width:1.3em;text-align:center}
.opt .txt{display:flex;flex-direction:column;flex:1}
.opt .lab{font-size:1.15em;font-weight:700;line-height:1.35}
.opt .note{font-size:.8em;color:var(--muted)}
.opt .tick{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:.9em;font-weight:700;color:#fff;background:var(--c);opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s}
.opt[aria-pressed="true"]{border-color:var(--c);box-shadow:0 10px 24px rgba(91,74,138,.18),0 0 0 3px var(--c)}
.opt[aria-pressed="true"] .tick{opacity:1;transform:scale(1)}
.done{margin:0;padding:18px 20px;border-radius:20px;background:var(--sage);color:var(--sage-ink);font-size:.95em}
.done b{display:block;font-size:1.05em;margin-bottom:2px}
.err{margin:0;padding:14px 18px;border-radius:16px;background:#FBE9E4;color:#8A3B2A;font-size:.9em}
.demo{margin:0;font-size:.72em;color:var(--muted);text-align:center;background:rgba(255,255,255,.6);border-radius:999px;padding:6px 14px}
.foot{margin:0;font-size:.75em;color:var(--muted);text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <p class="demo" id="demo" hidden>試看模式（尚未連上 Firebase）</p>
  <div>
    <p class="kicker">心情投票</p>
    <h1 id="q"></h1>
  </div>
  <p class="how">點一下最接近的那一個就完成了。想改，再點別的就好。</p>
  <div class="opts" id="opts" role="group" aria-labelledby="q"></div>
  <p class="done" id="done" role="status" hidden></p>
  <p class="err" id="err" role="alert" hidden></p>
  <p class="foot">不記名・不需要登入・不收任何個人資料</p>
</main>

<script src="config.js"></script>
<script src="store.js"></script>
<script>
(function () {
  var cfg = window.MOOD_CONFIG, opts = cfg.options;
  var room = MoodStore.room(), me = MoodStore.deviceId();
  var choiceKey = "moodvote:choice:" + room;
  var $ = function (id) { return document.getElementById(id); };
  var store = null, round = null, chosen = null, sending = 0;

  $("q").textContent = cfg.question;
  document.title = "心情投票｜" + cfg.question;

  var buttons = opts.map(function (o, i) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "opt"; b.disabled = true;
    b.style.setProperty("--c", o.color);
    b.setAttribute("aria-pressed", "false");
    b.innerHTML = '<span class="emo" aria-hidden="true"></span><span class="txt"><span class="lab"></span><span class="note"></span></span><span class="tick" aria-hidden="true">✓</span>';
    b.querySelector(".emo").textContent = o.emoji;
    b.querySelector(".lab").textContent = o.label;
    b.querySelector(".note").textContent = o.note || "";
    b.addEventListener("click", function () { send(i); });
    $("opts").appendChild(b);
    return b;
  });

  function loadChoice() {
    try { return JSON.parse(localStorage.getItem(choiceKey)); } catch (e) { return null; }
  }
  function saveChoice(v) {
    try { localStorage.setItem(choiceKey, JSON.stringify(v)); } catch (e) {}
  }

  function paint() {
    buttons.forEach(function (b, i) { b.setAttribute("aria-pressed", String(i === chosen)); });
    if (chosen === null) { $("done").hidden = true; return; }
    var o = opts[chosen];
    $("done").hidden = false;
    $("done").innerHTML = "<b></b><span></span>";
    $("done").firstChild.textContent = "已送出：" + o.emoji + " " + o.label;
    $("done").lastChild.textContent = cfg.thanks;
  }

  function send(i) {
    if (!store || round === null) return;
    var r = round, ticket = ++sending;
    chosen = i; paint();
    $("err").hidden = true;
    var slow = setTimeout(function () {
      if (ticket === sending) { $("err").hidden = false; $("err").textContent = "網路好像不太穩，正在努力送出，請稍等一下…"; }
    }, 6000);
    store.vote(me, i, r).then(function () {
      clearTimeout(slow);
      if (ticket === sending) { $("err").hidden = true; saveChoice({ round: r, mood: i }); }
    }).catch(function () {
      clearTimeout(slow);
      if (ticket !== sending) return;
      chosen = null; paint();
      $("err").hidden = false; $("err").textContent = "沒有送出成功。請確認網路後，再點一次。";
    });
  }

  MoodStore.connect(room).then(function (s) {
    store = s;
    $("demo").hidden = s.mode !== "demo";
    s.watchRound(function (r) {
      if (r === round) return;   // 只有換新一輪時才需要處理
      round = r;
      var saved = loadChoice();
      chosen = saved && saved.round === r ? saved.mood : null;   // 主持人按「重新開始」後，清空上一輪的選擇
      buttons.forEach(function (b) { b.disabled = false; });
      paint();
    });
  }).catch(function () {
    $("err").hidden = false; $("err").textContent = "連不上投票系統。請確認網路後，重新整理這一頁。";
  });
})();
</script>
</body>
</html>
