<style>

}

#t-line { top: 1100px; font-size: 80px; font-weight: 500; letter-spacing: .1em; line-height: 1.7; }
#t2-a { top: 300px; font-size: 190px; font-weight: 900; letter-spacing: .1em; padding-left: .1em; line-height: 1.2; }
#t2-b { top: 560px; font-size: 96px; font-weight: 500; letter-spacing: .16em; padding-left: .16em; color: var(--glow); }

#t3-b { top: 440px; font-size: 100px; font-weight: 500; letter-spacing: .16em; padding-left: .16em; color: var(--glow); }
#t3-c { top: 250px; font-size: 130px; font-weight: 900; letter-spacing: .14em; padding-left: .14em; line-height: 1.2; }

button:hover { border-color: var(--dawn); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--dawn); outline-offset: 2px; }

.seg.on { border-color: var(--dawn); }

@media (prefers-reduced-motion: reduce) { .tx { transition: none; } }

<div class="wrap">
  <h1>115年義工教育成長研習營・宣傳影片</h1>
  <p class="sub">第三階段預覽：前三段「回望初心」「看見付出」「重新省思」（0～31 秒）。</p>

  <div id="frame" aria-label="9:16 直式動畫預覽">
    <div id="stage">
      <canvas id="cv" width="1080" height="1920"></canvas>
      <div class="tx" id="t-event">115年義工教育成長研習營</div>

  <div class="jump"><button type="button" id="j1">看第一段</button><button type="button" id="j2">看第二段</button><button type="button" id="j3">看第三段</button><button type="button" id="j4">全部連續</button></div>

  <div class="tl" aria-label="全片五段規劃（共約 52 秒）">
    <div class="seg on" id="sg0"><b>回望初心</b>0–10 秒</div>
    <div class="seg todo" id="sg1"><b>看見付出</b>10–21 秒</div>
    <div class="seg todo" id="sg2"><b>重新省思</b>21–31 秒</div>
    <div class="seg todo"><b>再次出發</b>31–42 秒</div>
    <div class="seg todo"><b>預留時間</b>42–52 秒</div>
  </div>

  <p class="note"><strong>這是動畫網頁預覽，還不是 MP4 影片。</strong>畫面由程式繪製，文字是另外疊上去的字幕層，所以不會有亂碼或錯字。確認方向後，才會進入輸出 MP4 的步驟。</p>

<script>
(function () {
  var W = 1080, H = 1920, DUR = 31, S1 = 10, S2 = 21;
  var cv = document.getElementById('cv'), cx = cv.getContext('2d');
  var frame = document.getElementById('frame'), stage = document.getElementById('stage');

  // 固定亂數：同一個時間點永遠畫出同一張圖，之後才能逐格輸出影片
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
  var ease = function (x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
  var lerp = function (a, b, k) { return a + (b - a) * k; };
  var seg = function (t, a, b) { return ease((t - a) / (b - a)); };
  function mix(c1, c2, k) { return 'rgb(' + [0, 1, 2].map(function (i) { return Math.round(lerp(c1[i], c2[i], k)); }).join(',') + ')'; }

  var r = rng(7), stars = [], motes = [];
  for (var i = 0; i < 90; i++) stars.push({ x: r() * W, y: r() * 1000, s: .6 + r() * 1.8, p: r() * 6.28 });
  for (var j = 0; j < 70; j++) motes.push({ x: 300 + r() * 480, y0: 900 + r() * 900, sp: 30 + r() * 70, sw: 10 + r() * 40, ph: r() * 6.28, s: 1.5 + r() * 3.5 });

  // 山稜線：用疊加的正弦波得到起伏
  function ridgeY(x, base, amp, seed, drift) {
    var u = (x + drift) / W;
    return base - amp * (.55 * Math.sin(u * 5 + seed) + .3 * Math.sin(u * 11 + seed * 2.3) + .15 * Math.sin(u * 23 + seed * 4.1));
  }
  function ridge(t, base, amp, seed, color, drift) {
    cx.beginPath(); cx.moveTo(0, H);
    for (var x = 0; x <= W; x += 12) cx.lineTo(x, ridgeY(x, base, amp, seed, drift));
    cx.lineTo(W, H); cx.closePath(); cx.fillStyle = color; cx.fill();
  }

  function draw1(t) {
    var dawn = seg(t, 0.5, 8.5);                    // 天色由夜轉晨
    var push = 1 + .06 * (t / DUR);                  // 鏡頭緩慢推進
    cx.save();
    cx.clearRect(0, 0, W, H);
    cx.translate(W / 2, H * .62); cx.scale(push, push); cx.translate(-W / 2, -H * .62);

    // 天空
    var g = cx.createLinearGradient(0, 0, 0, H * .85);
    g.addColorStop(0, mix([8, 11, 26], [28, 38, 78], dawn));
    g.addColorStop(.55, mix([18, 26, 52], [150, 98, 96], dawn));
    g.addColorStop(1, mix([30, 36, 66], [244, 176, 108], dawn));
    cx.fillStyle = g; cx.fillRect(-100, -100, W + 200, H + 200);

    // 星星漸隱
    var sa = 1 - seg(t, 1, 6);
    stars.forEach(function (s) { cx.globalAlpha = sa * (.45 + .45 * Math.sin(t * 1.6 + s.p)); cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(s.x, s.y, s.s, 0, 6.283); cx.fill(); });
    cx.globalAlpha = 1;

    // 初心之光：地平線上的暖光
    var hx = W / 2, hy = lerp(1330, 1160, ease(t / DUR));
    var gr = lerp(260, 760, dawn);
    var rg = cx.createRadialGradient(hx, hy, 0, hx, hy, gr);
    rg.addColorStop(0, 'rgba(255,226,170,' + (.35 + .55 * dawn) + ')');
    rg.addColorStop(.35, 'rgba(244,166,90,' + (.18 + .3 * dawn) + ')');
    rg.addColorStop(1, 'rgba(244,166,90,0)');
    cx.fillStyle = rg; cx.fillRect(0, 0, W, H);

    // 三層遠山，越遠越亮、移動越慢
    ridge(t, 1330, 150, 1.0, mix([30, 40, 78], [190, 128, 110], dawn), t * 2);
    ridge(t, 1450, 190, 2.4, mix([18, 26, 56], [106, 74, 92], dawn), t * 4);
    ridge(t, 1600, 230, 4.1, mix([9, 13, 30], [44, 34, 50], dawn), t * 7);

    // 山谷薄霧
    var mg = cx.createLinearGradient(0, 1380, 0, 1700);
    mg.addColorStop(0, 'rgba(255,220,180,0)'); mg.addColorStop(.5, 'rgba(255,220,180,' + (.10 * dawn + .03) + ')'); mg.addColorStop(1, 'rgba(255,220,180,0)');
    cx.fillStyle = mg; cx.fillRect(0, 1380, W, 320);

    // 前景暗稜 + 一盞小燈（初心）
    ridge(t, 1760, 120, 6.7, 'rgb(6,8,18)', t * 10);
    var lx = W / 2, ly = 1668, pulse = .85 + .15 * Math.sin(t * 2.4);
    var lg = cx.createRadialGradient(lx, ly, 0, lx, ly, 150 * pulse);
    lg.addColorStop(0, 'rgba(255,236,190,.95)'); lg.addColorStop(.3, 'rgba(255,190,110,.5)'); lg.addColorStop(1, 'rgba(255,170,90,0)');
    cx.fillStyle = lg; cx.fillRect(lx - 200, ly - 200, 400, 400);
    cx.fillStyle = '#fff4d6'; cx.beginPath(); cx.arc(lx, ly, 7, 0, 6.283); cx.fill();

    // 從小燈升起的光點
    var ma = seg(t, 1.2, 3.2);
    motes.forEach(function (m) {
      var y = m.y0 - m.sp * t; if (y < 150) y += 1700; if (y < 150 || y > 1700) return;
      var x = lx + (m.x - 540) * .35 + Math.sin(t * .8 + m.ph) * m.sw;
      var fade = clamp((1700 - y) / 300, 0, 1) * clamp((y - 150) / 300, 0, 1);
      cx.globalAlpha = .75 * ma * fade; cx.fillStyle = '#ffe1a8';
      cx.beginPath(); cx.arc(x, y, m.s, 0, 6.283); cx.fill();
    });
    cx.globalAlpha = 1;
    cx.restore();

    // 暗角（不隨鏡頭移動）
    var vg = cx.createRadialGradient(W / 2, H / 2, 500, W / 2, H / 2, 1250);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)');
    cx.fillStyle = vg; cx.fillRect(0, 0, W, H);
    // 開場淡入
    cx.fillStyle = 'rgba(0,0,0,' + clamp(1 - seg(t, 0, 1.2), 0, 1) + ')'; cx.fillRect(0, 0, W, H);
  }


  // ===== 第二段：看見付出（s = t - 10，共 11 秒）=====
  // 同一個地方、同一盞燈：從第一段結尾接續，天色由清晨慢慢轉為傍晚，
  // 其他的燈都長在山稜線上，由第一盞燈向外一圈圈點亮。
  var LX = W / 2, LY = 1668;                         // 第一盞燈（與第一段相同位置）
  var LAY = [                                          // 與第一段完全相同的四層山
    { base: 1330, amp: 150, seed: 1.0, d0: 20, v: 2,  n: 9, sz: .8 },
    { base: 1450, amp: 190, seed: 2.4, d0: 40, v: 4,  n: 7, sz: 1.1 },
    { base: 1600, amp: 230, seed: 4.1, d0: 70, v: 7,  n: 5,  sz: 1.5 }
  ];
  var r2 = rng(33), lamps2 = [];
  LAY.forEach(function (L, li) {
    for (var q = 0; q < L.n; q++) {
      var x = 30 + (q + .15 + r2() * .7) * (W - 60) / L.n;
      lamps2.push({ li: li, x: x, sz: L.sz * (.8 + r2() * .5), ph: r2() * 6.28 });
    }
  });
  lamps2.forEach(function (l) {
    var L = LAY[l.li], y = ridgeY(l.x, L.base, L.amp, L.seed, L.d0);
    l.t0 = 2.2 + Math.hypot(l.x - LX, y - LY) / 260;   // 離第一盞燈越遠，越晚亮
  });
  var stars2 = []; for (var i2 = 0; i2 < 110; i2++) stars2.push({ x: r2() * W, y: r2() * 1000, s: .6 + r2() * 1.6, p: r2() * 6.28 });

  function heart(x, y, r, a, f) {                     // 發光愛心：r 是大小，a 是亮度
    cx.save(); cx.translate(x, y); cx.globalAlpha = clamp(a, 0, 1);
    cx.beginPath(); cx.moveTo(0, r * .95);
    cx.bezierCurveTo(-r * 1.7, -r * .1, -r * .95, -r * 1.25, 0, -r * .5);
    cx.bezierCurveTo(r * .95, -r * 1.25, r * 1.7, -r * .1, 0, r * .95); cx.closePath();
    var g = cx.createRadialGradient(0, -r * .1, 0, 0, 0, r * 1.5);
    g.addColorStop(0, '#fff6e2'); g.addColorStop(.55, '#ffd2a0'); g.addColorStop(1, '#ff9f7a');
    cx.fillStyle = g; cx.fill(); cx.restore();
  }
  function lightPool(x, y, rad, a, flat) {             // 用「疊加」混色，讓光真的照亮背後的山
    cx.save(); cx.globalCompositeOperation = 'lighter'; cx.translate(x, y); cx.scale(1, flat);
    var g = cx.createRadialGradient(0, 0, 0, 0, 0, rad);
    g.addColorStop(0, 'rgba(255,214,150,' + a + ')'); g.addColorStop(.35, 'rgba(255,160,80,' + a * .35 + ')'); g.addColorStop(1, 'rgba(255,140,60,0)');
    cx.fillStyle = g; cx.fillRect(-rad, -rad, rad * 2, rad * 2); cx.restore();
  }

  function draw2(s) {
    var dawn = 1 - seg(s, .2, 3.4);                    // 清晨 → 傍晚（s=0 時與第一段結尾完全相同）
    var lit = seg(s, 2.2, 9);                          // 全場亮燈比例
    var k = lerp(1.06, 1.0, ease(seg(s, 0, 10)));      // 鏡頭從第一段的推進位置，慢慢退回
    cx.save(); cx.clearRect(0, 0, W, H);
    cx.translate(W / 2, H * .62); cx.scale(k, k); cx.translate(-W / 2, -H * .62);

    var g = cx.createLinearGradient(0, 0, 0, H * .85);
    g.addColorStop(0, mix([8, 11, 26], [28, 38, 78], dawn));
    g.addColorStop(.55, mix([18, 26, 52], [150, 98, 96], dawn));
    g.addColorStop(1, mix([30, 36, 66], [244, 176, 108], dawn));
    cx.fillStyle = g; cx.fillRect(-100, -100, W + 200, H + 200);

    var sa = (1 - dawn) * .9;
    stars2.forEach(function (st) { cx.globalAlpha = sa * (.45 + .45 * Math.sin(s * 1.6 + st.p)); cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(st.x, st.y, st.s, 0, 6.283); cx.fill(); });
    cx.globalAlpha = 1;

    // 晨光退去的地平線暖光；之後由燈火接手
    var hy = 1160, gr = lerp(300, 760, dawn);
    var rg = cx.createRadialGradient(W / 2, hy, 0, W / 2, hy, gr);
    var ha = dawn * dawn;
    rg.addColorStop(0, 'rgba(255,226,170,' + (.35 + .55 * dawn) * ha + ')'); rg.addColorStop(.35, 'rgba(244,166,90,' + (.18 + .3 * dawn) * ha + ')'); rg.addColorStop(1, 'rgba(244,166,90,0)');
    cx.fillStyle = rg; cx.fillRect(0, 0, W, H);
    lightPool(W / 2, 1420, 700, .22 * lit, .5);       // 夜裡改由燈火在山後透出暖光

    var cols = [mix([30, 40, 78], [190, 128, 110], dawn), mix([18, 26, 56], [106, 74, 92], dawn), mix([9, 13, 30], [44, 34, 50], dawn)];
    LAY.forEach(function (L, li) {
      var dr = L.d0 + s * L.v;
      ridge(s, L.base, L.amp, L.seed, cols[li], dr);
      // 這一層山上已經亮的燈：光落在稜線上，也照亮附近山坡
      lamps2.forEach(function (l) {
        if (l.li !== li) return;
        var a = seg(s, l.t0, l.t0 + .9); if (a <= 0) return;
        var y = ridgeY(l.x, L.base, L.amp, L.seed, dr) - 3, f = .85 + .15 * Math.sin(s * 2.2 + l.ph);
        var hr = 17 * l.sz * (1 + .06 * Math.sin(s * 2.2 + l.ph));
        lightPool(l.x, y + 8, 110 * l.sz, .5 * a * f, .45);
        lightPool(l.x, y - hr * .6, 70 * l.sz, .85 * a * f, 1);
        heart(l.x, y - hr * .9, hr, a, f);
      });
      if (li === 1) {                                  // 山谷薄霧
        var mg = cx.createLinearGradient(0, 1380, 0, 1700);
        mg.addColorStop(0, 'rgba(255,220,180,0)'); mg.addColorStop(.5, 'rgba(255,220,180,' + (.04 + .08 * lit) + ')'); mg.addColorStop(1, 'rgba(255,220,180,0)');
        cx.fillStyle = mg; cx.fillRect(0, 1380, W, 320);
      }
    });

    // 前景暗稜 + 第一盞燈（與第一段同一盞）
    ridge(s, 1760, 120, 6.7, 'rgb(6,8,18)', 100 + s * 10);
    var pulse = .88 + .12 * Math.sin((S1 + s) * 2.4);
    lightPool(LX, LY + 14, 340 * pulse, .5 + .3 * lit, .35);   // 照在腳下山坡的光
    var hh = seg(s, .5, 2.2);                           // 圓點 → 愛心
    lightPool(LX, LY, lerp(150, 200, hh) * pulse, .95, 1);
    cx.globalAlpha = 1 - hh; cx.fillStyle = '#fff4d6'; cx.beginPath(); cx.arc(LX, LY, 7, 0, 6.283); cx.fill(); cx.globalAlpha = 1;
    heart(LX, LY - 40, 64 * (.9 + .1 * pulse), hh, 1);

    // 整片山的暖色天光，隨燈數增加
    var wg = cx.createLinearGradient(0, 1100, 0, 1750);
    wg.addColorStop(0, 'rgba(255,170,90,0)'); wg.addColorStop(1, 'rgba(255,170,90,' + (.10 * lit) + ')');
    cx.save(); cx.globalCompositeOperation = 'lighter'; cx.fillStyle = wg; cx.fillRect(0, 1100, W, 650); cx.restore();
    cx.restore();

    var vg = cx.createRadialGradient(W / 2, H / 2, 500, W / 2, H / 2, 1250);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)');
    cx.fillStyle = vg; cx.fillRect(0, 0, W, H);
  }


  // ===== 第三段：重新省思（s = t - 21，共 10 秒）=====
  // 承接第二段夜景，鏡頭往下移，露出一面湖，湖面映出滿山的愛心；一滴水落下，漣漪輕輕晃動倒影。
  var off = document.createElement('canvas'); off.width = W; off.height = H; var offx = off.getContext('2d');
  function drawLandTo(s) { var main = cx; cx = offx; draw2(s); cx = main; }

  function draw3(s) {
    drawLandTo(11 + s * .3);
    var dy = 560 * ease(seg(s, .4, 4.6)), y0 = H - dy;       // y0：湖岸線在畫面上的位置
    cx.clearRect(0, 0, W, H);
    cx.drawImage(off, 0, -dy);
    if (dy > 2) {
      var drop = 0; for (var k = 0; k < 3; k++) { var ag = s - (4.8 + k * 1.2); if (ag > 0 && ag < 4) drop = Math.max(drop, 1 - ag / 4); }
      for (var y = y0; y < H; y += 4) {
        var sy = Math.max(0, Math.min(H - 4, 2 * y0 - y - 4 + dy));
        var amp = 1.5 + (y - y0) * .018 + drop * (4 + (y - y0) * .03);
        var ox = Math.sin(y * .05 + s * 1.9) * amp;
        cx.drawImage(off, 0, sy, W, 4, ox, y, W, 4);
      }
      var wg = cx.createLinearGradient(0, y0, 0, H);
      wg.addColorStop(0, 'rgba(6,10,26,.30)'); wg.addColorStop(1, 'rgba(4,7,18,.72)');
      cx.fillStyle = wg; cx.fillRect(0, y0, W, H - y0);
      cx.fillStyle = 'rgba(255,214,160,.28)'; cx.fillRect(0, y0 - 1, W, 2);          // 湖岸線
      for (var q = 0; q < 3; q++) {                                                     // 漣漪
        var a = s - (4.8 + q * 1.2); if (a <= 0 || a >= 4) continue;
        var rr = a * 200; cx.strokeStyle = 'rgba(255,230,190,' + (1 - a / 4) * .55 + ')'; cx.lineWidth = 3;
        cx.beginPath(); cx.ellipse(W / 2, y0 + 280, rr, rr * .28, 0, 0, 6.283); cx.stroke();
      }
      var dd = seg(s, 4.1, 4.8);                                                         // 落下的一滴光
      if (dd > 0 && dd < 1) { var dyy = lerp(y0 - 260, y0 + 280, dd * dd); lightPool(W / 2, dyy, 40, .9, 1); }
    }
    cx.fillStyle = 'rgba(0,0,0,' + clamp(seg(s, 9.3, 10) + (1 - seg(s, 0, .01)) * 0, 0, 1) + ')'; cx.fillRect(0, 0, W, H);
  }

  function draw(t) { if (t < S1) draw1(t); else if (t < S2) draw2(t - S1); else draw3(t - S2); }

  // 文字層：全部是 HTML 文字，時間決定出現與淡出
  var tx = { e: document.getElementById('t3-a'), f: document.getElementById('t3-b'), g: document.getElementById('t3-c'), h: document.getElementById('t3-d'), a: document.getElementById('t2-a'), b: document.getElementById('t2-b'), c: document.getElementById('t2-c'), d: document.getElementById('t2-d'), ev: document.getElementById('t-event'), sm: document.getElementById('t-small'), mn: document.getElementById('t-main'), ln: document.getElementById('t-line') };
  function put(el, t, a, b, c, d, rise) {            // a→b 淡入，c→d 淡出
    var o = seg(t, a, b) * (1 - seg(t, c, d));
    el.style.opacity = o; el.style.transform = 'translateY(' + ((1 - seg(t, a, b)) * rise) + 'px)';
  }
  function text(t) {
    var s = t - S1;
    put(tx.ev, t, .8, 2.2, 9.2, 9.9, 0);
    put(tx.sm, t, 2.0, 3.4, 9.2, 9.9, 24);
    put(tx.mn, t, 3.2, 5.2, 9.2, 9.9, 36);
    tx.mn.style.letterSpacing = lerp(.3, .12, seg(t, 3.2, 6)) + 'em';
    put(tx.ln, t, 6.4, 7.8, 9.2, 9.9, 20);
    put(tx.a, s, .8, 2.0, 6.0, 6.8, 20);       // 一盞燈
    put(tx.b, s, 3.0, 4.2, 6.0, 6.8, 20);       // 一份心意
    put(tx.c, s, 7.0, 8.0, 10.0, 10.6, 20);       // 謝謝你
    put(tx.d, s, 8.0, 9.0, 10.0, 10.6, 20);     // 一直都在
    var u = t - S2;
    put(tx.e, u, 1.0, 2.0, 4.6, 5.4, 20);       // 停一停
    put(tx.f, u, 2.2, 3.2, 4.6, 5.4, 20);       // 看看自己
    put(tx.g, u, 5.8, 6.8, 9.2, 9.8, 20);       // 這一路
    put(tx.h, u, 6.8, 7.8, 9.2, 9.8, 20);       // 心還在嗎？
  }

  function render(t) { draw(t); text(t); document.getElementById('sg0').className = 'seg' + (t < S1 ? ' on' : ''); document.getElementById('sg1').className = 'seg' + (t >= S1 && t < S2 ? ' on' : ' todo'); document.getElementById('sg2').className = 'seg' + (t >= S2 ? ' on' : ' todo'); document.getElementById('clock').textContent = t.toFixed(1) + ' / ' + DUR.toFixed(1) + ' 秒'; }
  window.renderAt = render;                           // 之後輸出 MP4 時，逐格呼叫這個函式

  function fit() {
    var availW = Math.min(frame.parentNode.clientWidth, 520);
    var availH = Math.max(window.innerHeight - 260, 380);
    var w = Math.min(availW, availH * 9 / 16);
    frame.style.width = w + 'px'; frame.style.height = (w * 16 / 9) + 'px';
    stage.style.transform = 'scale(' + (w / W) + ')';
  }
  window.addEventListener('resize', fit); fit();

  var seek = document.getElementById('seek'), btn = document.getElementById('play');
  var t = 0, playing = false, last = 0;
  function loop(now) {
    if (!playing) return;
    t += (now - last) / 1000; last = now;
    if (t >= DUR) { t = DUR; playing = false; btn.textContent = '重播'; }
    seek.value = t; render(t);
    if (playing) requestAnimationFrame(loop);
  }
  btn.onclick = function () {
    if (playing) { playing = false; btn.textContent = '播放'; return; }
    if (t >= DUR) t = 0;
    playing = true; btn.textContent = '暫停'; last = performance.now(); requestAnimationFrame(loop);
  };
  seek.oninput = function () { t = parseFloat(seek.value); render(t); };

  function jump(a) { playing = false; btn.textContent = '播放'; t = a; seek.value = a; render(a); }
  document.getElementById('j1').onclick = function () { jump(7.2); };
  document.getElementById('j2').onclick = function () { jump(15.5); };
  document.getElementById('j3').onclick = function () { jump(26.5); };
  document.getElementById('j4').onclick = function () { jump(0); playing = true; btn.textContent = '暫停'; last = performance.now(); requestAnimationFrame(loop); };
  render(7.2);                                        // 靜止時先停在能看到完整畫面的位置
  seek.value = 7.2; t = 7.2;
  document.fonts && document.fonts.ready.then(function () { render(t); });
})();
</script>
