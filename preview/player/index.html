<title>初心宣傳影片</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;900&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
/* 單欄：標題、直式影片、三步說明 */
:root {
  --ink: #0b1020; --panel: #141c36; --line: #2a3354; --paper: #f6ecd9; --glow: #ffd9a0; --mute: #a4aac0;
  --font-display: "Noto Serif TC", "Songti TC", serif; --font-body: "Noto Sans TC", "PingFang TC", sans-serif;
  color-scheme: dark;
}
body { background: var(--ink); color: var(--paper); font-family: var(--font-body); font-size: 18px; padding-inline: 16px; padding-block: 20px 40px; }
.wrap { max-width: 460px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }
h1 { font-family: var(--font-display); font-weight: 900; font-size: 1.6rem; margin: 0; letter-spacing: .06em; text-wrap: balance; }
.sub { margin: 0; color: var(--glow); font-size: 1rem; }
video { width: 100%; max-width: 100%; aspect-ratio: 9 / 16; background: #000; border-radius: 8px; display: block; }
ol { margin: 0; padding: 16px 16px 16px 40px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; line-height: 1.8; display: flex; flex-direction: column; gap: 6px; }
li::marker { color: var(--glow); font-weight: 500; }
.note { color: var(--mute); font-size: .95rem; line-height: 1.7; margin: 0; }
</style>
<div class="wrap">
  <h1>115年義工教育成長研習營・初心</h1>
  <p class="sub">宣傳影片　52 秒（山水荷花配樂）</p>
  <video src="chuxin.mp4" controls playsinline preload="metadata"></video>
  <ol>
    <li>點影片中間的播放鍵</li>
    <li>把手機音量調大，或戴上耳機</li>
    <li>看完後，回到對話告訴我感覺如何</li>
  </ol>
  <p class="note">想全螢幕觀看，可以點影片右下角的放大圖示。</p>
</div>
