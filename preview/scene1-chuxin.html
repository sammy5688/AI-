<title>初心 動畫預覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;500;900&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
/* 版面：直式 9:16 舞台置中，下方為播放控制與五段時間軸 */
:root {
  --ink: #0b1020;
  --night: #121a33;
  --dawn: #f2a65a;
  --glow: #ffd9a0;
  --paper: #f6ecd9;
  --mute: #8d93a8;
  --line: #2a3354;
  --font-display: "Noto Serif TC", "Songti TC", serif;
  --font-body: "Noto Sans TC", "PingFang TC", sans-serif;
  color-scheme: dark;
}
html, body { height: auto; }
body { background: var(--ink); color: var(--paper); font-family: var(--font-body); padding-inline: 16px; padding-block: 20px 32px; }
.wrap { max-width: 520px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
h1 { font-family: var(--font-display); font-weight: 500; font-size: 1rem; letter-spacing: .12em; margin: 0; color: var(--glow); }
.sub { margin: 0; font-size: .8125rem; color: var(--mute); line-height: 1.6; }
#frame { align-self: center; position: relative; overflow: hidden; border-radius: 6px; background: #000; box-shadow: 0 0 0 1px var(--line); }
#stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
#cv { position: absolute; inset: 0; width: 1080px; height: 1920px; }
.tx { position: absolute; left: 0; width: 1080px; text-align: center; color: var(--paper); font-family: var(--font-display); opacity: 0; will-change: opacity, transform; text-shadow: 0 4px 40px rgba(0,0,0,.55); }
#t-event { top: 140px; font-size: 54px; letter-spacing: .2em; font-weight: 500; color: var(--glow); }
#t-small { top: 540px; font-size: 76px; letter-spacing: .5em; padding-left: .5em; font-weight: 500; }
#t-main { top: 640px; font-size: 300px; font-weight: 900; letter-spacing: .12em; padding-left: .12em; line-height: 1.1; }
#t-line { top: 1100px; font-size: 80px; font-weight: 500; letter-spacing: .1em; line-height: 1.7; }
.ctl { display: flex; align-items: center; gap: 12px; }
button { font: inherit; background: var(--night); color: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 10px 18px; min-height: 44px; cursor: pointer; }
button:hover { border-color: var(--dawn); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--dawn); outline-offset: 2px; }
input[type=range] { flex: 1; min-width: 0; accent-color: var(--dawn); height: 44px; }
#clock { font-variant-numeric: tabular-nums; font-size: .8125rem; color: var(--mute); min-width: 5.5em; text-align: right; }
.tl { display: grid; grid-template-columns: 10fr 11fr 10fr 11fr 10fr; gap: 4px; }
.seg { min-width: 0; border-top: 3px solid var(--line); padding-top: 6px; font-size: .75rem; color: var(--mute); line-height: 1.4; }
.seg b { display: block; font-weight: 500; color: var(--paper); font-size: .8125rem; }
.seg.on { border-color: var(--dawn); }
.seg.todo { opacity: .55; }
.note { border-left: 3px solid var(--dawn); padding: 4px 0 4px 12px; font-size: .8125rem; color: var(--mute); line-height: 1.7; }
.note strong { color: var(--paper); font-weight: 500; }
@media (prefers-reduced-motion: reduce) { .tx { transition: none; } }
</style>

<div class="wrap">
  <h1>115年義工教育成長研習營・宣傳影片</h1>
  <p class="sub">第一階段預覽：第一段「回望初心」（0～10 秒）。請看完後告訴我方向對不對。</p>

  <div id="frame" aria-label="9:16 直式動畫預覽">
    <div id="stage">
      <canvas id="cv" width="1080" height="1920"></canvas>
      <div class="tx" id="t-event">115年義工教育成長研習營</div>
      <div class="tx" id="t-small">回望</div>
      <div class="tx" id="t-main">初心</div>
      <div class="tx" id="t-line">還記得<br>當初為什麼出發嗎？</div>
    </div>
  </div>

  <div class="ctl">
    <button id="play" type="button">播放</button>
    <input id="seek" type="range" min="0" max="10" step="0.01" value="0" aria-label="時間軸">
    <span id="clock">0.0 / 10.0 秒</span>
  </div>

  <div class="tl" aria-label="全片五段規劃（共約 52 秒）">
    <div class="seg on"><b>回望初心</b>0–10 秒</div>
    <div class="seg todo"><b>看見付出</b>10–21 秒</div>
    <div class="seg todo"><b>重新省思</b>21–31 秒</div>
    <div class="seg todo"><b>再次出發</b>31–42 秒</div>
    <div class="seg todo"><b>預留時間</b>42–52 秒</div>
  </div>

  <p class="note"><strong>這是動畫網頁預覽，還不是 MP4 影片。</strong>畫面由程式繪製，文字是另外疊上去的字幕層，所以不會有亂碼或錯字。確認方向後，才會進入輸出 MP4 的步驟。</p>
</div>

<script>
(function () {
  var W = 1080, H = 1920, DUR = 10;
  var cv = document.getElementById('cv'), cx = cv.getContext('2d');
  var frame = document.getElementById('frame'), stage = document.getElementById('stage');

  // 固定亂數：同一個時間點永遠畫出同一張圖，之後才能逐格輸出影片
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
  var ease = function (x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
  var lerp = function (a, b, k) { return a + (b - a) * k; };
  var seg = function (t, a, b) { return ease((t - a) / (b - a)); };
  function mix(c1, c2, k) { return 'rgb(' + [0, 1, 2].map(function (i) { return Math.round(lerp(c1[i], c2[i], k)); }).join(',') + ')'; }

  var r = rng(7), stars = [], motes = [];
  for (var i = 0; i < 90; i++) stars.push({ x: r() * W, y: r() * 1000, s: .6 + r() * 1.8, p: r() * 6.28 });
  for (var j = 0; j < 70; j++) motes.push({ x: 300 + r() * 480, y0: 900 + r() * 900, sp: 30 + r() * 70, sw: 10 + r() * 40, ph: r() * 6.28, s: 1.5 + r() * 3.5 });

  // 山稜線：用疊加的正弦波得到起伏
  function ridge(t, base, amp, seed, color, drift) {
    cx.beginPath(); cx.moveTo(0, H);
    for (var x = 0; x <= W; x += 12) {
      var u = (x + drift) / W;
      var y = base - amp * (.55 * Math.sin(u * 5 + seed) + .3 * Math.sin(u * 11 + seed * 2.3) + .15 * Math.sin(u * 23 + seed * 4.1));
      cx.lineTo(x, y);
    }
    cx.lineTo(W, H); cx.closePath(); cx.fillStyle = color; cx.fill();
  }

  function draw(t) {
    var dawn = seg(t, 0.5, 8.5);                    // 天色由夜轉晨
    var push = 1 + .06 * (t / DUR);                  // 鏡頭緩慢推進
    cx.save();
    cx.clearRect(0, 0, W, H);
    cx.translate(W / 2, H * .62); cx.scale(push, push); cx.translate(-W / 2, -H * .62);

    // 天空
    var g = cx.createLinearGradient(0, 0, 0, H * .85);
    g.addColorStop(0, mix([8, 11, 26], [28, 38, 78], dawn));
    g.addColorStop(.55, mix([18, 26, 52], [150, 98, 96], dawn));
    g.addColorStop(1, mix([30, 36, 66], [244, 176, 108], dawn));
    cx.fillStyle = g; cx.fillRect(-100, -100, W + 200, H + 200);

    // 星星漸隱
    var sa = 1 - seg(t, 1, 6);
    stars.forEach(function (s) { cx.globalAlpha = sa * (.45 + .45 * Math.sin(t * 1.6 + s.p)); cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(s.x, s.y, s.s, 0, 6.283); cx.fill(); });
    cx.globalAlpha = 1;

    // 初心之光：地平線上的暖光
    var hx = W / 2, hy = lerp(1330, 1160, ease(t / DUR));
    var gr = lerp(260, 760, dawn);
    var rg = cx.createRadialGradient(hx, hy, 0, hx, hy, gr);
    rg.addColorStop(0, 'rgba(255,226,170,' + (.35 + .55 * dawn) + ')');
    rg.addColorStop(.35, 'rgba(244,166,90,' + (.18 + .3 * dawn) + ')');
    rg.addColorStop(1, 'rgba(244,166,90,0)');
    cx.fillStyle = rg; cx.fillRect(0, 0, W, H);

    // 三層遠山，越遠越亮、移動越慢
    ridge(t, 1330, 150, 1.0, mix([30, 40, 78], [190, 128, 110], dawn), t * 2);
    ridge(t, 1450, 190, 2.4, mix([18, 26, 56], [106, 74, 92], dawn), t * 4);
    ridge(t, 1600, 230, 4.1, mix([9, 13, 30], [44, 34, 50], dawn), t * 7);

    // 山谷薄霧
    var mg = cx.createLinearGradient(0, 1380, 0, 1700);
    mg.addColorStop(0, 'rgba(255,220,180,0)'); mg.addColorStop(.5, 'rgba(255,220,180,' + (.10 * dawn + .03) + ')'); mg.addColorStop(1, 'rgba(255,220,180,0)');
    cx.fillStyle = mg; cx.fillRect(0, 1380, W, 320);

    // 前景暗稜 + 一盞小燈（初心）
    ridge(t, 1760, 120, 6.7, 'rgb(6,8,18)', t * 10);
    var lx = W / 2, ly = 1668, pulse = .85 + .15 * Math.sin(t * 2.4);
    var lg = cx.createRadialGradient(lx, ly, 0, lx, ly, 150 * pulse);
    lg.addColorStop(0, 'rgba(255,236,190,.95)'); lg.addColorStop(.3, 'rgba(255,190,110,.5)'); lg.addColorStop(1, 'rgba(255,170,90,0)');
    cx.fillStyle = lg; cx.fillRect(lx - 200, ly - 200, 400, 400);
    cx.fillStyle = '#fff4d6'; cx.beginPath(); cx.arc(lx, ly, 7, 0, 6.283); cx.fill();

    // 從小燈升起的光點
    var ma = seg(t, 1.2, 3.2);
    motes.forEach(function (m) {
      var y = m.y0 - m.sp * t; if (y < 150) y += 1700; if (y < 150 || y > 1700) return;
      var x = lx + (m.x - 540) * .35 + Math.sin(t * .8 + m.ph) * m.sw;
      var fade = clamp((1700 - y) / 300, 0, 1) * clamp((y - 150) / 300, 0, 1);
      cx.globalAlpha = .75 * ma * fade; cx.fillStyle = '#ffe1a8';
      cx.beginPath(); cx.arc(x, y, m.s, 0, 6.283); cx.fill();
    });
    cx.globalAlpha = 1;
    cx.restore();

    // 暗角（不隨鏡頭移動）
    var vg = cx.createRadialGradient(W / 2, H / 2, 500, W / 2, H / 2, 1250);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)');
    cx.fillStyle = vg; cx.fillRect(0, 0, W, H);
    // 開場淡入
    cx.fillStyle = 'rgba(0,0,0,' + (1 - seg(t, 0, 1.2)) + ')'; cx.fillRect(0, 0, W, H);
  }

  // 文字層：全部是 HTML 文字，時間決定出現與淡出
  var tx = { ev: document.getElementById('t-event'), sm: document.getElementById('t-small'), mn: document.getElementById('t-main'), ln: document.getElementById('t-line') };
  function put(el, t, a, b, c, d, rise) {            // a→b 淡入，c→d 淡出
    var o = seg(t, a, b) * (1 - seg(t, c, d));
    el.style.opacity = o; el.style.transform = 'translateY(' + ((1 - seg(t, a, b)) * rise) + 'px)';
  }
  function text(t) {
    put(tx.ev, t, .8, 2.2, 99, 100, 0);
    put(tx.sm, t, 2.0, 3.4, 99, 100, 24);
    put(tx.mn, t, 3.2, 5.2, 99, 100, 36);
    tx.mn.style.letterSpacing = lerp(.3, .12, seg(t, 3.2, 6)) + 'em';
    put(tx.ln, t, 6.4, 7.8, 99, 100, 20);
  }

  function render(t) { draw(t); text(t); document.getElementById('clock').textContent = t.toFixed(1) + ' / ' + DUR.toFixed(1) + ' 秒'; }
  window.renderAt = render;                           // 之後輸出 MP4 時，逐格呼叫這個函式

  function fit() {
    var availW = Math.min(frame.parentNode.clientWidth, 520);
    var availH = Math.max(window.innerHeight - 260, 380);
    var w = Math.min(availW, availH * 9 / 16);
    frame.style.width = w + 'px'; frame.style.height = (w * 16 / 9) + 'px';
    stage.style.transform = 'scale(' + (w / W) + ')';
  }
  window.addEventListener('resize', fit); fit();

  var seek = document.getElementById('seek'), btn = document.getElementById('play');
  var t = 0, playing = false, last = 0;
  function loop(now) {
    if (!playing) return;
    t += (now - last) / 1000; last = now;
    if (t >= DUR) { t = DUR; playing = false; btn.textContent = '重播'; }
    seek.value = t; render(t);
    if (playing) requestAnimationFrame(loop);
  }
  btn.onclick = function () {
    if (playing) { playing = false; btn.textContent = '播放'; return; }
    if (t >= DUR) t = 0;
    playing = true; btn.textContent = '暫停'; last = performance.now(); requestAnimationFrame(loop);
  };
  seek.oninput = function () { t = parseFloat(seek.value); render(t); };

  render(7.2);                                        // 靜止時先停在能看到完整畫面的位置
  seek.value = 7.2; t = 7.2;
  document.fonts && document.fonts.ready.then(function () { render(t); });
})();
</script>
